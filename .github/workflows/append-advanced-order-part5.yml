## ‏5.31 Recommendation — מה להכניס ל־Execution Research מוקדם

‏אחרי חלק 5, רשימת ה־Challengers המוקדמת שלנו מתרחבת ל־:

```text
A. Passive displayed Limit + short TTL
B. Marketable Limit + IOC
C. Relative/Pegged-to-Primary + hard cap + short TTL
D. MidPrice + hard cap
E. Snap to Midpoint + short TTL
F. Directed Pegged-to-Midpoint + hard cap
```

‏לא משום שכולן ייכנסו ל־Live, אלא משום שכל אחת בודקת trade-off אחר:

```text
A = simple passive baseline
B = urgency
C = continuous passive aggressiveness
D = broker-managed midpoint search
E = midpoint initialization without chase
F = explicit midpoint peg
```

‏זו קבוצת ניסוי הרבה יותר מקצועית מאשר לבחור מראש Order Type אחת ולכפות אותה על כל Regime.

