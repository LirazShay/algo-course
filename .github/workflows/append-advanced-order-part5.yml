## ‏5.34 Practitioner Secrets — הדברים שקל לפספס

### ‏1. Pegged אינה "Limit שמתעדכנת" באופן כללי

‏צריך לדעת reference, offset, cap, route וכיוון repricing.

### ‏2. SMART Relative ו־Directed Relative אינן אותו דבר

‏ב־IBKR יש directionality שונה; זו semantics שיכולה לשנות P&L.

### ‏3. MidPrice ו־Pegged-to-Midpoint אינן מילים נרדפות

‏אחת Broker Algo עם SMART; השנייה explicit pegged behavior שדורשת Directed routing למניות אמריקאיות.

### ‏4. Snap היא לא Peg איטית

‏היא מחשבת initial price מהשוק ואז מפסיקה לעקוב.

### ‏5. Price improvement בלי Fill אינו Edge

‏Midpoint יפה על הנייר לא שווה דבר אם Signal בורח לפני Fill.

### ‏6. Pegged יכולה לייצר chase בלי cancel/replace

‏לכן cap ו־signal TTL עדיין חובה.

### ‏7. Broker-managed repricing אינו Strategy-managed repricing

‏הברוקר רואה market reference; הוא לא רואה את כל state של המודל שלנו.

### ‏8. Route הוא חלק מה־Order Type

‏בפקודות האלה route אינו פרט תשתיתי. הוא יכול לשנות את semantics עצמה.

