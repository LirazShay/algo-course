## ‏5.30 מטריצת התאמה ראשונית למנוע שלנו

| כלי | התאמה ראשונית | למה מעניין | הסיכון המרכזי |
|---|---|---|---|
| `Relative/Pegged-to-Primary` | `High/Challenger` | ‏Passive אך אגרסיבי ומתעדכן | ‏route semantics, adverse selection, auto-chase |
| `Pegged-to-Midpoint` | `High/Challenger` | ‏חצי spread / price improvement | ‏Direct routing, no-fill, venue dependence |
| `MidPrice` | `High/Challenger` | ‏SMART midpoint-or-better routing | ‏פחות deterministic, fill latency |
| `Snap to Market` | `Medium/High` | ‏מחיר התחלתי חכם בלי chase מתמשך | ‏stale resting limit אחרי snap |
| `Snap to Midpoint` | `High/Challenger` | ‏midpoint-based initial price בלי continual peg | ‏no-fill / signal decay |
| `Snap to Primary` | `Medium/High` | ‏initial improvement מול near side | ‏Directed routing, stale price |
| `IBKR ATS Pegged-to-Best` | `Advanced Challenger` | ‏תחרות גם מול ATS same-side liquidity | ‏ATS-specific complexity |
| `Pegged-to-Benchmark` | `Low now / Future` | ‏relative-value execution | ‏לא תואם כרגע core signal |
| Options-only pegged families | `Knowledge Only` | ‏הבנת עולם execution | ‏לא stock-engine candidate |

