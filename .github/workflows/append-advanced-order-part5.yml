## ‏5.32 איך לבחור ביניהן בזמן אמת

‏ה־Policy יכולה להסתכל על:

```text
signal_strength
signal_age
spread_ticks
spread_bps
visible_depth
quote_velocity
expected_edge
max_wait_ms
position_state
route_capability
```

‏דוגמה רעיונית:

```text
if urgency is very high:
    marketable_limit_ioc
elif spread is wide and signal has time:
    midpoint_family
elif passive intent but queue is moving:
    relative_primary
elif want quote-derived initial price without chase:
    snap
else:
    simple passive limit
```

‏זו לא לוגיקת Live סופית; זו מפת ניסוי.

