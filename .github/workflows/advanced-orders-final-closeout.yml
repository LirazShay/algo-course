name: Advanced Orders final closeout

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/advanced-orders-final-closeout.yml'

permissions:
  contents: write

jobs:
  final-closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Assert final repository cleanliness
        shell: bash
        run: |
          set -euo pipefail

          test ! -e advanced-orders/review
          test ! -e advanced-orders/parts
          test ! -e advanced-orders/build/generate-course.cmd

          expected_top=$'ADVANCED-ORDER-MASTERY.md\nbuild\nprint\nsource'
          actual_top="$(find advanced-orders -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          test "$actual_top" = "$expected_top"

          test "$(find advanced-orders -type f | wc -l)" -eq 45
          test "$(find advanced-orders/source -maxdepth 1 -type f | wc -l)" -eq 40
          test "$(find advanced-orders/source -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 39
          test "$(find advanced-orders/build -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(find advanced-orders/print -maxdepth 1 -type f | wc -l)" -eq 3

          test -f advanced-orders/build/assemble.mjs
          test -f advanced-orders/print/index.html
          test -f advanced-orders/print/serve.mjs
          test -f advanced-orders/print/verify-print.mjs

      - name: Assert canonical manifest coverage
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { access, readFile, readdir } from 'node:fs/promises';

          const path = 'advanced-orders/source/manifest.json';
          const manifest = JSON.parse(await readFile(path, 'utf8'));
          if (!Array.isArray(manifest.entries) || manifest.entries.length !== 39) {
            throw new Error(`expected 39 manifest entries, found ${manifest.entries?.length}`);
          }
          if (manifest.entries.some(entry => entry.status !== 'ready')) {
            throw new Error('all manifest entries must be ready');
          }

          const ids = new Set();
          const sources = new Set();
          for (const entry of manifest.entries) {
            if (ids.has(entry.id)) throw new Error(`duplicate id: ${entry.id}`);
            if (sources.has(entry.source)) throw new Error(`duplicate source: ${entry.source}`);
            ids.add(entry.id);
            sources.add(entry.source);
            await access(entry.source);
          }

          const sourceFiles = (await readdir('advanced-orders/source'))
            .filter(name => name.endsWith('.md'))
            .map(name => `advanced-orders/source/${name}`)
            .sort();
          const manifestSources = [...sources].sort();
          if (JSON.stringify(sourceFiles) !== JSON.stringify(manifestSources)) {
            throw new Error('source directory differs from manifest source set');
          }

          if (manifest.printVerification?.state !== 'R9I_POST_CLEANUP_COMPLETE') {
            throw new Error(`post-cleanup print verification is not complete: ${manifest.printVerification?.state}`);
          }
          if (manifest.printVerification?.sourceCount !== 39) {
            throw new Error('post-cleanup print verification source count must be 39');
          }
          NODE

      - name: Verify final generated master
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          node advanced-orders/build/assemble.mjs --check | tee /tmp/advanced-orders-final-check.log
          grep -qx 'CHECK_OK' /tmp/advanced-orders-final-check.log
          sha="$(sed -n 's/^sha256=//p' /tmp/advanced-orders-final-check.log | tail -n 1)"
          sources="$(sed -n 's/^sources=//p' /tmp/advanced-orders-final-check.log | tail -n 1)"
          test -n "$sha"
          test "$sources" = '39'
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Record final completed state
        env:
          FINAL_SHA256: ${{ steps.assemble.outputs.sha256 }}
          CLOSEOUT_RUN_ID: ${{ github.run_id }}
          VERIFIED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const path = 'advanced-orders/source/manifest.json';
          const manifest = JSON.parse(await readFile(path, 'utf8'));

          if (manifest.generatedMaster?.generatedSha256 !== process.env.FINAL_SHA256) {
            throw new Error(`final SHA mismatch: ${process.env.FINAL_SHA256} != ${manifest.generatedMaster?.generatedSha256}`);
          }
          if (manifest.printVerification?.generatedSha256 !== process.env.FINAL_SHA256) {
            throw new Error('print verification SHA does not match final generated master');
          }

          delete manifest.migrationState;
          delete manifest.legacyMaster;

          manifest.repairState = 'R9_COMPLETE';
          manifest.repairCheckpoint = 'R9J_FINAL_CLOSEOUT_COMPLETE';
          manifest.generatedMaster = {
            ...manifest.generatedMaster,
            reason: 'Final canonical course is deterministically generated from 39 ready sources and remains byte-identical after final cleanup and closeout verification.'
          };
          manifest.finalCloseout = {
            state: 'R9J_COMPLETE',
            workflowRunId: process.env.CLOSEOUT_RUN_ID,
            verifiedCommit: process.env.VERIFIED_COMMIT,
            generatedSha256: process.env.FINAL_SHA256,
            retainedAdvancedOrdersFiles: 45,
            canonicalSourceCount: 39,
            checks: [
              'advanced-orders contains only the final master plus source, build, and print trees',
              'review and parts trees are absent',
              'superseded local generation runner is absent',
              'source contains exactly 39 ready manifest Markdown sources plus manifest.json',
              'build contains only the deterministic assembler',
              'print contains only the retained viewer, server, and browser verification script',
              'canonical assembler --check succeeds against the retained final master',
              'post-cleanup Chromium print verification is recorded complete for the same SHA-256',
              'legacy migration metadata is removed from the final manifest'
            ],
            remainingWork: []
          };

          await writeFile(path, `${JSON.stringify(manifest, null, 2)}\n`, 'utf8');
          NODE

      - name: Self-remove closeout workflow and commit final state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/advanced-orders-final-closeout.yml
          git add advanced-orders/source/manifest.json
          changed="$(git status --porcelain)"
          test -n "$changed"
          unexpected="$(printf '%s\n' "$changed" | sed -E 's/^.. //' | grep -Ev '^(advanced-orders/source/manifest.json|\.github/workflows/advanced-orders-final-closeout.yml)$' || true)"
          test -z "$unexpected"
          git commit -m 'R9J complete advanced orders final closeout'
          git push origin HEAD:main
