name: Run Advanced Order Mastery Part 5 Append

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-append-part5.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract part 5 and append to course
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/append-advanced-order-part5.yml').read_text(encoding='utf-8')
          token = "part = r'''"
          if token not in source:
              raise SystemExit('part payload not found')
          part = source.split(token, 1)[1].split("'''", 1)[0]

          target = Path('advanced-orders/ADVANCED-ORDER-MASTERY.md')
          text = target.read_text(encoding='utf-8')
          old_status = '- ‏שלב נוכחי: `4 — Liquidity control: Post Only, Hidden, Reserve/Iceberg and queue behavior`.'
          new_status = '- ‏שלב נוכחי: `5 — Pegged, Relative, Midpoint and Snap families`.'
          if old_status in text:
              text = text.replace(old_status, new_status, 1)

          marker = '# ‏חלק 5 — Pegged, Relative, Midpoint ו־Snap: פקודות שמזיזות את עצמן'
          if marker not in text:
              text = text.rstrip() + '\n' + part.rstrip() + '\n'

          target.write_text(text, encoding='utf-8')
          PY
      - name: Commit course update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add advanced-orders/ADVANCED-ORDER-MASTERY.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: add advanced order mastery part 5'
          git push origin HEAD:main
